spring.application.name=IndustryOne
server.port=8080

# ==============================================================================
# Supabase PostgreSQL Configuration
# ==============================================================================
# Option A: Direct Connection (Port 5432)
# Found in: Supabase Dashboard -> Project Settings -> Database -> Connection string -> JDBC / URI
# Format: jdbc:postgresql://db.<PROJECT_REF>.supabase.co:5432/postgres?sslmode=require
spring.datasource.url=jdbc:postgresql://db.xfwohkzvesrsgqzagzdr.supabase.co:5432/postgres?sslmode=require
spring.datasource.username=postgres
spring.datasource.password=Arnabg@1714

# Option B: Connection Pooler / IPv4 (Port 6543 or 5432)
# Use this if your network does not support IPv6 or if you encounter connection timeouts.
# spring.datasource.url=jdbc:postgresql://aws-0-ap-south-1.pooler.supabase.com:6543/postgres?sslmode=require
# spring.datasource.username=postgres.YOUR_PROJECT_REF
# spring.datasource.password=YOUR_SUPABASE_DB_PASSWORD

# ==============================================================================
# JPA & Hibernate Settings for Supabase
# ==============================================================================
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true

# HikariCP Connection Pool Settings (Optimized for cloud hosted Supabase)
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.max-lifetime=1800000

server.error.include-message=never
server.error.include-stacktrace=never
